spring.application.name=agencia-viagens-api
server.port=8080

# ============================================================
# CONEXAO COM O BANCO DE DADOS POSTGRESQL
# ============================================================
# O banco "agencia_viagens" precisa existir antes de subir a aplicacao
# (as instrucoes de criacao estao no README).
#
# As credenciais usam variaveis de ambiente com valor padrao:
# ${VARIAVEL:valor_padrao}. Assim o projeto roda direto apos o clone,
# mas em outro ambiente basta definir as variaveis, sem alterar o codigo.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agencia_viagens}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
# update: o Hibernate cria e ajusta as tabelas automaticamente a partir
# das entidades anotadas com @Entity, preservando os dados existentes.
# Adequado para desenvolvimento e para esta atividade academica.
# Em producao o recomendado e "validate" junto a uma ferramenta de
# migracao de schema (Flyway ou Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Exibe no console o SQL gerado pelo Hibernate — util para aprender
# e para conferir o que esta sendo executado no banco.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mantem a conexao aberta durante a serializacao para JSON.
# Definido explicitamente como false (boa pratica): os DTOs ja carregam
# tudo que a resposta precisa, evitando consultas inesperadas ao banco.
spring.jpa.open-in-view=false

# ============================================================
# MENSAGENS DE ERRO
# ============================================================
server.error.include-message=always

# ============================================================
# LOG DE SEGURANCA (opcional, ajuda a depurar permissoes)
# ============================================================
# Descomente a linha abaixo para ver em detalhe as decisoes do Spring Security.
# logging.level.org.springframework.security=DEBUG
